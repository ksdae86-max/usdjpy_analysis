name: USD/JPY Market Analysis

on:
  schedule:
    # 日本時間 午前9:15に実行 (UTC 0:15)
    - cron: '15 0 * * *'
  workflow_dispatch: # 手動実行ボタンを有効化

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # ここに yfinance を追加しました
          pip install requests pandas numpy yfinance

      - name: Run analysis
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          GSHEET_URL: ${{ secrets.GSHEET_URL }}
        # ファイル名を wick_detector.py に修正
        run: python wick_detector.py
