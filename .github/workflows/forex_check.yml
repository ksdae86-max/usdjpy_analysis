name: USD/JPY Market Analysis

on:
  schedule:
    # 日本時間 午前9:15に実行 (UTC 0:15)
    # yfinanceにより米国市場クローズ(朝7-8時)直後の確定データを取得可能
    - cron: '15 0 * * *'
  workflow_dispatch: # 手動実行ボタンを有効化

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          # Python 3.10以上にすることで、yfinance最新版のエラーを回避
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # yfinanceを含む必要ライブラリをインストール
          pip install requests pandas numpy yfinance

      - name: Run analysis
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          GSHEET_URL: ${{ secrets.GSHEET_URL }}
        # 実行ファイル名を wick_detector.py に指定
        run: python wick_detector.py
