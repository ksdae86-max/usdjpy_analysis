name: Forex Wick Analysis

on:
  schedule:
    # 火〜土の日本時間 午前7:05 (UTC 22:05) に実行
    # FXの日足確定タイミングに合わせ、日月（市場休み）の実行を避ける
    - cron: '5 22 * * 2-6'
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip' # キャッシュを有効にして実行速度向上
          
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install yfinance==0.2.33 requests pandas numpy
          
      - name: Run Analysis
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python wick_detector.py
